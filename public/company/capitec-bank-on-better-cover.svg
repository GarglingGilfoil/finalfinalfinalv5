      <stop offset="0" stop-color="#052060" />
      <stop offset="0.54" stop-color="#0b347f" />
      <stop offset="1" stop-color="#06184a" />
    </linearGradient>
    <linearGradient id="redPanel" x1="0" x2="1" y1="0" y2="1">
